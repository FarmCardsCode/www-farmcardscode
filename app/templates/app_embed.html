<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ app.title }} | Farm Cards Code</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      height: 100%;
      background: #0b0b0d;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    .embed-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.6rem;
      background: #17171a;
      border-bottom: 1px solid #333;
      font-family: "Courier New", Courier, monospace;
      font-size: 0.8rem;
    }
    .embed-bar a,
    .embed-bar button {
      color: #f5f7fa;
      text-decoration: none;
      background: rgba(255, 49, 92, 0.15);
      border: 1px solid #a61a34;
      border-radius: 6px;
      padding: 0.35rem 0.6rem;
      font: inherit;
      cursor: pointer;
    }
    .embed-bar a:hover,
    .embed-bar button:hover {
      background: rgba(255, 49, 92, 0.25);
    }
    .embed-title {
      color: #b3bac5;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #embedFrame {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
    }
    #embedFrame iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
    #embedFrame:fullscreen {
      background: #0b0b0d;
    }
  </style>
</head>
<body>
  <div class="embed-bar">
    <a href="{{ url_for('main.apps') }}">&larr; Farm Cards Code</a>
    <span class="embed-title">{{ app.title }}</span>
    <button type="button" id="embedFullscreenBtn">Fullscreen</button>
  </div>
  <div id="embedFrame">
    <iframe
      id="embedIframe"
      src="{{ url_for('static', filename=app.url) }}"
      title="{{ app.title }}"
      sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock"
    ></iframe>
  </div>

  <script>
    const embedFrame = document.getElementById("embedFrame");
    const embedFullscreenBtn = document.getElementById("embedFullscreenBtn");

    embedFullscreenBtn.addEventListener("click", () => {
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else {
        embedFrame.requestFullscreen();
      }
    });

    document.addEventListener("fullscreenchange", () => {
      embedFullscreenBtn.textContent = document.fullscreenElement
        ? "Exit Fullscreen"
        : "Fullscreen";
    });
  </script>
</body>
</html>
