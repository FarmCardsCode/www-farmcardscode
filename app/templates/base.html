<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Farm Cards Code{% endblock %}</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="noise"></div>
  <div class="scanlines"></div>

  <main class="terminal-shell">
    <div class="terminal-bar">
      <div class="terminal-left">
        <span class="dot red"></span>
        <span class="dot dark"></span>
        <span class="dot dark"></span>
        <span class="title">guest@farmcardscode.org:~</span>
      </div>

      <div class="terminal-left">
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle theme">
          <svg class="theme-toggle-icon" data-icon="sun" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
          <svg class="theme-toggle-icon" data-icon="moon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>
      </div>
    </div>

    <nav class="site-nav">
      <a href="{{ url_for('main.index') }}" class="nav-link {% if request.endpoint == 'main.index' %}active{% endif %}">
	    Home
      </a>
      <a href="{{ url_for('main.classes') }}" class="nav-link {% if request.endpoint == 'main.classes' %}active{% endif %}">
	    Classes
      </a>
      <a href="{{ url_for('main.pathway') }}" class="nav-link {% if request.endpoint == 'main.pathway' %}active{% endif %}">
	    Pathway
      </a>
      <a href="{{ url_for('main.apps') }}" class="nav-link {% if request.endpoint in ('main.apps', 'main.app_detail') %}active{% endif %}">
	    Apps
      </a>
      <a href="{{ url_for('main.news') }}" class="nav-link {% if request.endpoint == 'main.news' %}active{% endif %}">
	    News
      </a>
    </nav>
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
